	<!-- SLIM: resumen en tarjetas. Conserva todos los id que rellena el codigo original. -->
	<div class="slim-ov">
		<div class="slim-ov-head">
			<div>
				<h2 class="slim-ov-title">Resumen</h2>
				<div class="slim-ov-sub"><span id="sntp_date"></span> <span id="timestamp"></span></div>
			</div>
			<div class="slim-ov-actions">
				<span class="slim-pill" id="statusflow"></span>
				<button type="button" class="button slim-read-now" id="slim_read_now" title="Iniciar una ronda de lectura ahora">&#9654; Leer ahora</button>
			</div>
		</div>

		<div class="slim-ov-cards">
			<div class="slim-card"><div class="slim-card-label">Valor</div><div class="slim-card-value" id="value"></div><div class="slim-card-foot" id="slim_unit">kWh</div></div>
			<div class="slim-card"><div class="slim-card-label">Valor previo</div><div class="slim-card-value" id="prevalue"></div><div class="slim-card-foot">guardado</div></div>
			<div class="slim-card"><div class="slim-card-label">Consumo hoy</div><div class="slim-card-value" id="slim_today">&ndash;</div><div class="slim-card-foot" id="slim_today_foot">kWh</div></div>
			<div class="slim-card"><div class="slim-card-label">Estado</div><div class="slim-card-state" id="slim_state">&ndash;</div><div class="slim-card-foot" id="slim_state_foot"></div></div>
		</div>

		<div class="slim-ov-main">
			<div class="slim-card slim-ov-image">
				<div class="slim-card-label">Imagen de la cámara</div>
				<img id="img" src="" alt="Imagen alineada con las regiones de interés">
				<div class="slim-ov-chips"><span class="slim-chip">Lectura bruta: <b id="raw"></b></span></div>
			</div>
			<div class="slim-ov-side">
				<div class="slim-card">
					<div class="slim-card-label">Consumo últimas 24 h</div>
					<div id="slim_chart" class="slim-chart"><span class="slim-muted">Cargando datos...</span></div>
				</div>
				<div class="slim-card">
					<div class="slim-card-label">Estado del valor</div>
					<div id="error" class="slim-ov-error"></div>
				</div>
				<div class="slim-card slim-ov-sys">
					<div class="slim-card-label">Información del sistema</div>
					<div id="cputemp"></div>
					<div id="rssi"></div>
					<div><span id="uptime"></span> <span id="round"></span></div>
				</div>
			</div>
		</div>
	</div>

	<script type="text/javascript" src="jquery-3.6.0.min.js?v=$COMMIT_HASH"></script>

	<script type="text/javascript">
		function addZero(i) {
			if (i < 10) {
				i = "0" + i;
			}
			return i;
		}

		$(document).ready(function() {
			LoadData();
			LoadROIImage();
		});

		function LoadData(){
			loadValue("value", "value", "border-collapse: collapse; width: 100%");
			loadValue("raw", "raw", "border-collapse: collapse; width: 100%");
			loadValue("prevalue", "prevalue", "border-collapse: collapse; width: 100%");
			loadValue("error", "error", "border-collapse: collapse; width: 100%");
			loadStatus();
			loadSntpDate();
			loadCPUTemp();
			loadRSSI();
			loadUptime();
			loadRoundCounter();
		}

		function LoadROIImage(){
			var d = new Date();
			var timestamp = d.getTime();
			var h = addZero(d.getHours());
			var m = addZero(d.getMinutes());
			var s = addZero(d.getSeconds());
			document.getElementById("img").src = getDomainname() + '/img_tmp/alg_roi.jpg?timestamp=' + timestamp;
			$('#timestamp').html("Last Page Refresh:" + (h + ":" + m + ":" + s));
		}

		function Refresh() {
			setTimeout (function() {
				LoadData();
				LoadROIImage();
				Refresh();
			}, 300000);
		}

		function loadStatus() {
			url = domainname + '/statusflow';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#statusflow').html(_rsp);
				}
			}
			
			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadCPUTemp() {
			url = domainname + '/cpu_temperature';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#cputemp').html("CPU Temperature: " +_rsp + "°C");
				}
			}
			
			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadRSSI() {
			url = domainname + '/rssi';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
				
					if (_rsp >= -55) {
						$('#rssi').html("WIFI Signal: Excellent (" + _rsp + "dBm)");
					}
					else if (_rsp < -55 && _rsp >= -67) {
						$('#rssi').html("WIFI Signal: Good (" + _rsp + "dBm)");
					}
					else if (_rsp < -67 && _rsp >= -78) {
						$('#rssi').html("WIFI Signal: Fair (" + _rsp + "dBm)");
					}
					else if (_rsp < -78 && _rsp >= -85) {
						$('#rssi').html("WIFI Signal: Weak (" + _rsp + "dBm)");
					}
					else {
						$('#rssi').html("WIFI Signal: Unreliable (" + _rsp + "dBm)");
					}
				}
			}
			
			xhttp.open("GET", url, true);
			xhttp.send();		
		}

		function loadSntpDate() {
			url = domainname + '/date';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function () {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#sntp_date').html("Date/Time on device: " + _rsp);
				}
			}

			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadUptime() {
			url = domainname + '/uptime';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#uptime').html("Uptime: " + _rsp);
				}
			}
			
			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadRoundCounter() {
			url = domainname + '/info?type=Round';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#round').html("(Round: " + _rsp + ")");
				}
			}
			
			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadValue(_type, _div, _style) {
			url = domainname + '/value?all=true&type=' + _type;     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					var _split = _rsp.split("\r");
					
					if (typeof _style == undefined) {
						out = "<table>";
					}
					else {
						out = "<table style=\"" + _style + "\">";
					}

					if (_split.length == 1) {
						var _zer = ZerlegeZeile(_split[0], "\t")
					
						if (_zer.length > 1) {
							out = _zer[1];
						}
						else {
							out = "";
						}
					}
					else {
						for (var j = 0; j < _split.length; ++j) {
							var _zer = ZerlegeZeile(_split[j], "\t")
						
							if (_zer.length == 1) {
								out = out + "<tr><td style=\"width: 22%; padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\">" + 
								_zer[0] + "</td><td style=\"padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\"> </td></tr>"; 
							}
							else {
								out = out + "<tr><td style=\"width: 22%; padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\">" + 
								_zer[0] + "</td><td style=\"padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\" >" + _zer[1] + "</td></tr>";
							}
						}
						out = out + "</table>"
					}
				document.getElementById(_div).innerHTML = out;
				}
			};
			
			xhttp.open("GET", url, true);
			xhttp.send();		
		}

		/* 
		function setImageMaxWidth() {
			loadConfig(domainname); 
			ParseConfig();
			param = getConfigParameters();
			
			if(param["TakeImage"]["CamFrameSize"].value == "QVGA") {
				document.getElementById("img").style.maxWidth = "320px";

			else {
				document.getElementById("img").style.maxWidth = "640px";
			}
		}

		function init(){
			domainname = getDomainname();
			// setImageMaxWidth(); // CamFrameSize was replaced by zoom - CamFrameSize is no longer needed/used for zoom 
			Refresh();
		}

		init();

	</script>

	<!-- SLIM: estadisticas del resumen (solo lectura de datos ya guardados) -->
	<script type="text/javascript">
	(function () {
		function el(id) { return document.getElementById(id); }
		function pad(n) { return (n < 10 ? "0" : "") + n; }
		function fileFor(d) { return "data_" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + ".csv"; }
		function parseTime(t) { return new Date(String(t).replace(/([+-]\d\d)(\d\d)$/, "$1:$2")); }
		function fmt(v) { return (Math.round(v * 10) / 10).toFixed(1); }

		/* Estado claro a partir del texto de "Estado del valor" */
		function updateState() {
			var t = (el("error").textContent || "").trim(), st = el("slim_state"), ft = el("slim_state_foot");
			st.className = "slim-card-state";
			if (!t) { st.textContent = "–"; ft.textContent = ""; return; }
			if (/^(no error|sin errores)$/i.test(t)) { st.textContent = "Sin errores"; st.classList.add("ok"); ft.textContent = "lectura válida"; }
			else if (/Rate too high|demasiado alto/i.test(t)) { st.textContent = "Lectura rechazada"; st.classList.add("bad"); ft.textContent = "cambio demasiado alto: revisa la cámara o el valor previo"; }
			else if (/Neg\. Rate|negativo/i.test(t)) { st.textContent = "Lectura rechazada"; st.classList.add("bad"); ft.textContent = "el valor bajó: revisa la cámara o el valor previo"; }
			else { st.textContent = "Revisar"; st.classList.add("warn"); ft.textContent = t.slice(0, 80); }
		}
		new MutationObserver(updateState).observe(el("error"), { childList: true, subtree: true, characterData: true });

		/* Consumo de hoy y grafica de 24 h desde los archivos de datos del dispositivo */
		function rowsOf(text) {
			var out = [];
			String(text || "").split("\n").forEach(function (line) {
				var c = line.split(",");
				if (c.length < 5) return;
				var v = parseFloat(c[3]);
				if (c[3] === "" || isNaN(v)) return;
				var d = parseTime(c[0]);
				if (!isNaN(d)) out.push({ t: d, n: c[1], v: v });
			});
			return out;
		}
		function get(url) { return fetch(url, { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).catch(function () { return ""; }); }
		function drawChart(pts) {
			var box = el("slim_chart");
			if (pts.length < 2) { box.innerHTML = '<span class="slim-muted">Aún no hay suficientes lecturas válidas en las últimas 24 h.</span>'; return; }
			var W = 300, H = 120, P = 6, t0 = pts[0].t.getTime(), t1 = pts[pts.length - 1].t.getTime();
			var lo = Math.min.apply(null, pts.map(function (p) { return p.v; })), hi = Math.max.apply(null, pts.map(function (p) { return p.v; }));
			if (hi - lo < 0.1) { hi = lo + 0.1; }
			var xy = pts.map(function (p) {
				var x = P + (W - 2 * P) * (t1 > t0 ? (p.t.getTime() - t0) / (t1 - t0) : 1);
				var y = H - P - (H - 2 * P) * (p.v - lo) / (hi - lo);
				return x.toFixed(1) + "," + y.toFixed(1);
			}).join(" ");
			box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Consumo de las últimas 24 horas">' +
				'<polyline class="slim-chart-area" points="' + P + ',' + (H - P) + ' ' + xy + ' ' + (W - P) + ',' + (H - P) + '"/>' +
				'<polyline class="slim-chart-line" points="' + xy + '"/></svg>' +
				'<div class="slim-chart-axis"><span>' + pad(pts[0].t.getHours()) + ':' + pad(pts[0].t.getMinutes()) + '</span><span>' + fmt(lo) + ' – ' + fmt(hi) + '</span><span>' +
				pad(pts[pts.length - 1].t.getHours()) + ':' + pad(pts[pts.length - 1].t.getMinutes()) + '</span></div>';
		}
		function loadStats() {
			var now = new Date(), yest = new Date(now.getTime() - 86400000), base = getDomainname() + "/fileserver/log/data/";
			Promise.all([get(base + fileFor(yest)), get(base + fileFor(now))]).then(function (r) {
				var all = rowsOf(r[0]).concat(rowsOf(r[1]));
				if (!all.length) { el("slim_today").textContent = "–"; el("slim_today_foot").textContent = "sin lecturas válidas hoy"; drawChart([]); return; }
				var name = all[all.length - 1].n;
				all = all.filter(function (p) { return p.n === name; }).sort(function (a, b) { return a.t - b.t; });
				/* Cadena coherente: desde la ultima lectura hacia atras, solo valores que no
				   suben al retroceder y sin saltos absurdos (lecturas erroneas aceptadas
				   durante una mala calibracion quedan fuera). */
				var chain = [all[all.length - 1]];
				for (var i = all.length - 2; i >= 0; i--) {
					var cur = chain[0].v, v = all[i].v;
					if (v <= cur && cur - v <= 50) chain.unshift(all[i]);
				}
				all = chain;
				var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
				var today = all.filter(function (p) { return p.t.getTime() >= midnight; });
				if (today.length) {
					var diff = today[today.length - 1].v - today[0].v;
					el("slim_today").textContent = (diff >= 0 ? "+" : "") + fmt(diff);
					el("slim_today_foot").textContent = "kWh · " + today.length + " lecturas válidas";
				} else { el("slim_today").textContent = "–"; el("slim_today_foot").textContent = "sin lecturas válidas hoy"; }
				drawChart(all.filter(function (p) { return p.t.getTime() >= now.getTime() - 86400000; }));
			});
		}

		/* "Leer ahora": mismo comando que "Control manual > Iniciar ronda" */
		function notify(t, kind) {
			var fw = window.firework || (window.parent && window.parent.firework);
			if (fw) fw.launch(t, kind, 5000); else alert(t);
		}
		el("slim_read_now").addEventListener("click", function () {
			var b = this; b.disabled = true;
			fetch(getDomainname() + "/flow_start", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
				notify(t, "success");
			}).catch(function () { notify("No se pudo iniciar la ronda", "danger"); })
			.then(function () { setTimeout(function () { b.disabled = false; LoadData(); LoadROIImage(); loadStats(); }, 45000); });
		});

		updateState();
		loadStats();
		setInterval(loadStats, 300000);
	})();
	</script>
